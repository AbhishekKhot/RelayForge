name: Bootstrap

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -B verify
      - name: Create local Docker environment
        run: python3 scripts/create-env.py
      - name: Verify clean Compose boot and recovery
        run: |
          chmod +x scripts/verify-compose.sh
          scripts/verify-compose.sh
      - name: Verify synchronous ingestion acceptance
        run: python3 deploy/ingestion-ha/verify.py
