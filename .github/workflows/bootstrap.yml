name: Bootstrap

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -B verify
      - name: Create local Docker environment
        run: python3 scripts/create-env.py
      - name: Verify documented clean HA Compose setup
        run: python3 scripts/verify-local-setup.py
      - name: Verify isolated PostgreSQL point-in-time restore
        run: python3 scripts/verify-ha-pitr.py
      - name: Verify clean Compose boot and recovery
        run: |
          chmod +x scripts/verify-compose.sh
          scripts/verify-compose.sh
      - name: Verify synchronous ingestion and J1 happy path
        run: python3 deploy/ingestion-ha/verify.py
      - name: Verify fenced PostgreSQL promotion
        run: python3 scripts/verify-ha-promotion.py
      - name: Verify observability and dependency readiness
        run: python3 scripts/verify-i3.py
