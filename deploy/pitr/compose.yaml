services:
  source:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    entrypoint: ["/bin/bash", "/opt/relayforge/source-entrypoint.sh"]
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/%f
      - -c
      - max_wal_senders=10
      - -c
      - fsync=on
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER_USER:?Set POSTGRES_SUPERUSER_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
      CONTROL_DB_USER: ${CONTROL_DB_USER:?Set CONTROL_DB_USER in .env}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?Set CONTROL_DB_PASSWORD in .env}
      INGESTION_DB_USER: ${INGESTION_DB_USER:?Set INGESTION_DB_USER in .env}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:?Set INGESTION_DB_PASSWORD in .env}
      DELIVERY_DB_USER: ${DELIVERY_DB_USER:?Set DELIVERY_DB_USER in .env}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD in .env}
    volumes:
      - source-data:/var/lib/postgresql/data
      - backup-data:/backup
      - archive-data:/archive
      - ./deploy/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
      - ./deploy/pitr/source-entrypoint.sh:/opt/relayforge/source-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  restored:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    entrypoint: ["/bin/bash", "/opt/relayforge/restore-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER_USER:?Set POSTGRES_SUPERUSER_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - restored-data:/var/lib/postgresql/data
      - backup-data:/backup:ro
      - archive-data:/archive:ro
      - ./deploy/pitr/restore-entrypoint.sh:/opt/relayforge/restore-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  source-data:
  backup-data:
  archive-data:
  restored-data:
