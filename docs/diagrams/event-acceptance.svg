<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="550" viewBox="0 0 1450 550" role="img" aria-label="RelayForge · event acceptance"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M 1 1 L 9 5.5 L 1 10" fill="none" stroke="#273449" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="1448" height="548" rx="24" fill="#fffdf8" stroke="#d6d0c5" stroke-width="2"/><text x="48" y="55" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="29" font-weight="700" fill="#26354a">RelayForge · event acceptance</text><text x="49" y="82" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" fill="#526073">The producer gets 202 only after a durable PostgreSQL commit</text><rect x="58" y="159" width="225" height="104" rx="17" fill="none" stroke="#75849a" stroke-width="1.2" opacity=".48" transform="rotate(.45 167.5 207)"/><rect x="55" y="155" width="225" height="104" rx="16" fill="#e8f2ff" stroke="#273449" stroke-width="2.5" transform="rotate(-.4 167.5 207)"/><text x="167.5" y="202" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#26354a">Producer</text><text x="167.5" y="224" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="15" font-weight="400" fill="#26354a">POST + Idempotency-Key</text><rect x="343" y="159" width="225" height="104" rx="17" fill="none" stroke="#75849a" stroke-width="1.2" opacity=".48" transform="rotate(.45 452.5 207)"/><rect x="340" y="155" width="225" height="104" rx="16" fill="#ddf5e9" stroke="#273449" stroke-width="2.5" transform="rotate(-.4 452.5 207)"/><text x="452.5" y="202" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#26354a">Ingestion API</text><text x="452.5" y="224" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="15" font-weight="400" fill="#26354a">auth, quota, validation</text><rect x="628" y="159" width="225" height="104" rx="17" fill="none" stroke="#75849a" stroke-width="1.2" opacity=".48" transform="rotate(.45 737.5 207)"/><rect x="625" y="155" width="225" height="104" rx="16" fill="#fff0d6" stroke="#273449" stroke-width="2.5" transform="rotate(-.4 737.5 207)"/><text x="737.5" y="202" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#26354a">PostgreSQL</text><text x="737.5" y="224" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="15" font-weight="400" fill="#26354a">event + outbox transaction</text><rect x="913" y="159" width="225" height="104" rx="17" fill="none" stroke="#75849a" stroke-width="1.2" opacity=".48" transform="rotate(.45 1022.5 207)"/><rect x="910" y="155" width="225" height="104" rx="16" fill="#f0e9ff" stroke="#273449" stroke-width="2.5" transform="rotate(-.4 1022.5 207)"/><text x="1022.5" y="202" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#26354a">Outbox publisher</text><text x="1022.5" y="224" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="15" font-weight="400" fill="#26354a">claim and publish</text><rect x="1198" y="159" width="205" height="104" rx="17" fill="none" stroke="#75849a" stroke-width="1.2" opacity=".48" transform="rotate(.45 1297.5 207)"/><rect x="1195" y="155" width="205" height="104" rx="16" fill="#ffe8e5" stroke="#273449" stroke-width="2.5" transform="rotate(-.4 1297.5 207)"/><text x="1297.5" y="202" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#26354a">Kafka</text><text x="1297.5" y="224" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="15" font-weight="400" fill="#26354a">event.accepted</text><path d="M 280 207 Q 308.5 202 337 207" fill="none" stroke="#273449" stroke-width="2.4" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 565 207 Q 593.5 202 622 207" fill="none" stroke="#273449" stroke-width="2.4" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 850 207 Q 878.5 202 907 207" fill="none" stroke="#273449" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="878.5" y="195" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" fill="#526073">later</text><path d="M 1135 207 Q 1163.5 202 1192 207" fill="none" stroke="#273449" stroke-width="2.4" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="393" y="364" width="305" height="88" rx="17" fill="none" stroke="#75849a" stroke-width="1.2" opacity=".48" transform="rotate(.45 542.5 404)"/><rect x="390" y="360" width="305" height="88" rx="16" fill="#ddf5e9" stroke="#273449" stroke-width="2.5" transform="rotate(-.4 542.5 404)"/><text x="542.5" y="399" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#26354a">202 Accepted + event_id</text><text x="542.5" y="421" text-anchor="middle" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="15" font-weight="400" fill="#26354a">after commit confirmation</text><path d="M 740 260 C 745 328 680 328 680 358" fill="none" stroke="#273449" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M 390 402 C 280 404 200 350 170 262" fill="none" stroke="#273449" stroke-width="2.4" marker-end="url(#arrow)"/><text x="65" y="509" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" fill="#526073">Publisher marks outbox rows published after Kafka acknowledgement; redelivery can duplicate transport.</text></svg>
